  <script>
    /* Boot shim: html.js gate, paint-blocking cover for the loader and
       page arrivals, and a watchdog that clears everything if app.js
       never boots. No facts, no content, shell state only. */
    (function () {
      var de = document.documentElement;
      de.classList.add("js");
      var red = false;
      try { red = window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) {}
      var seen = false, arrive = false;
      try {
        seen = sessionStorage.getItem("srSeen") === "1";
        arrive = sessionStorage.getItem("srArrive") === "1";
      } catch (e) {}
      if (!red && (!seen || arrive)) de.classList.add("sr-cover");
      setTimeout(function () {
        if (!window.__SR_BOOTED) { de.classList.remove("sr-cover"); de.classList.add("sr-noboot"); }
      }, 4000);
    })();
  </script>
